name: CI/CD - Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_HIDE2610 }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare Docker image name
        run: |
          USERNAME=$(echo "${{ secrets.DOCKERHUB_HIDE2610 }}" | tr '[:upper:]' '[:lower:]')
          echo "DOCKER_IMAGE=$USERNAME/news-basic:latest" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build -t "$DOCKER_IMAGE" .

      - name: Push Docker image
        run: |
          docker push "$DOCKER_IMAGE"